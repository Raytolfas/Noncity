name: Manual CI Build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Cargo build profile"
        required: true
        default: "release"
        type: choice
        options:
          - "release"
          - "debug"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: noncity
            artifact_name: noncity-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: noncity.exe
            artifact_name: noncity-windows-x86_64.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-${{ inputs.profile }}

      - name: Run unit & integration tests
        shell: bash
        run: cargo test

      - name: Compile Noncity
        shell: bash
        run: |
          if [ "${{ inputs.profile }}" = "release" ]; then
            cargo build --release --target ${{ matrix.target }}
            cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} ./${{ matrix.artifact_name }}
          else
            cargo build --target ${{ matrix.target }}
            cp target/${{ matrix.target }}/debug/${{ matrix.binary_name }} ./${{ matrix.artifact_name }}
          fi

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ./${{ matrix.artifact_name }}
          retention-days: 14
