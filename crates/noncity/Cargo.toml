[package]
name = "noncity"
version = "0.1.0"
edition = "2021"

[dependencies]
noncity-proto = { path = "../noncity-proto" }
noncity-net = { path = "../noncity-net" }
tokio = { version = "1.42", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
anyhow = "1.0"
bytes = "1.9"
hmac = "0.12"
sha2 = "0.10"
sha1 = "0.10"
uuid = { version = "1.11", features = ["v4", "v3", "serde"] }
rand = "0.8"
rsa = { version = "0.9", features = ["sha2"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
