[package]
name = "noncity-net"
version = "0.1.0"
edition = "2021"

[dependencies]
noncity-proto = { path = "../noncity-proto" }
tokio = { version = "1.42", features = ["net", "io-util", "sync", "time"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = { version = "0.3", features = ["sink"] }
bytes = "1.9"
thiserror = "2.0"
tracing = "0.1"
