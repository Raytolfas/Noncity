[package]
name = "noncity-net"
version = "0.1.0"
edition = "2021"
description = "Network layer for Noncity"
repository = "https://github.com/Raytolfas/Noncity"
license = "Apache-2.0"

[dependencies]
noncity-proto = { path = "../noncity-proto" }
tokio = { version = "1.42", features = ["net", "io-util", "sync", "time"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = { version = "0.3", features = ["sink"] }
bytes = "1.9"
thiserror = "2.0"
tracing = "0.1"
flate2 = "1.0"
aes = "0.8"
cfb8 = "0.8"
pin-project-lite = "0.2"
