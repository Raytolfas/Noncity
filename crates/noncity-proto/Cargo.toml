[package]
name = "noncity-proto"
version = "0.1.0"
edition = "2021"
description = "Protocol implementation for Noncity"
repository = "https://github.com/Raytolfas/Noncity"
license = "Apache-2.0"

[dependencies]
bytes = "1.9"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.11", features = ["v4", "v3", "serde"] }
md-5 = "0.10"
